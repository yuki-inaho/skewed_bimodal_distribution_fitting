[project]
name = "bimodal-skewfit"
version = "0.3.0"
description = "Maximum-likelihood fitting for skewed, bimodal, and K=2 Gaussian-mixture univariate distributions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "yuki-inaho", email = "yoshikawa@inaho.co" },
]
maintainers = [
    { name = "yuki-inaho", email = "yoshikawa@inaho.co" },
]
keywords = [
    "statistics",
    "bimodal-distribution",
    "skewed-distribution",
    "gaussian-mixture",
    "maximum-likelihood",
    "density-estimation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/yuki-inaho/skew_bimodal_distribution_fitting"
Repository = "https://github.com/yuki-inaho/skew_bimodal_distribution_fitting"
Issues = "https://github.com/yuki-inaho/skew_bimodal_distribution_fitting/issues"

[project.optional-dependencies]
report = [
    "pandas>=2.0",
    "matplotlib>=3.8",
]
notebook = [
    "pandas>=2.0",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbclient>=0.8",
    "ipython>=8.0",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.1a0",
    "radon>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbclient>=0.8",
    "ipython>=8.0",
    "ipykernel>=6.29",
]

[project.scripts]
bimodal-skewfit = "bimodal_skewfit.cli:main"
bimodal-skewfit-random = "bimodal_skewfit.random_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bimodal_skewfit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/justfile",
    "/docs",
]
exclude = [
    "/outputs",
    "/notebooks",
    "/examples",
    "/temp",
    "/dist",
    "/.venv",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.ty",
    "/docs/workdoc_*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
norecursedirs = ["temp", ".venv", ".git", "build", "dist", "*.egg-info", "examples", "notebooks"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "RET",
    "SIM",
    "UP",
    "ANN",
    "N",
    "RUF",
    "PERF",
    "PIE",
    "TID",
    "ARG",
    "NPY",
]
ignore = [
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG"]
"scripts/*" = ["ANN201"]
