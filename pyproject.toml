[project]
name = "bimodal-skewfit"
version = "0.2.0"
description = "Fitting skewed, bimodal, and K=2 Gaussian-mixture distributions in a uv environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbclient>=0.8",
    "ipython>=8.0",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.1a0",
    "radon>=6.0",
]

[project.scripts]
bimodal-skewfit = "bimodal_skewfit.cli:main"
bimodal-skewfit-random = "bimodal_skewfit.random_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
norecursedirs = ["temp", ".venv", ".git", "build", "dist", "*.egg-info"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "RET",
    "SIM",
    "UP",
    "ANN",
    "N",
    "RUF",
    "PERF",
    "PIE",
    "TID",
    "ARG",
    "NPY",
]
ignore = [
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG"]
"scripts/*" = ["ANN201"]
